name: Test Bump and Release Main
on:
  workflow_dispatch:
  push:
      branches:
        - 'main'
      paths:
        - '**.js'
        - '**.ts'
        - '**.vue'
        - '**.json'
        - '**.css'

permissions:
  id-token: write
  contents: write

jobs:
  tests:
    name: Ensure tests and builds are OK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  bump-and-publish:
    needs: [tests]
    name: 'Automated Version Bump'
    if: "success() && !startsWith(github.event.head_commit.message, 'chore: version bump')"
    runs-on: ubuntu-latest
    steps:
      - name: Get Github App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Bump
        if: success()
        uses: 'phips28/gh-action-bump-version@master'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          major-wording: 'BREAKING'
          default: 'minor'
          commit-message: 'chore: version bump to {{version}}'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci
      - name: Publish
        run: npm publish
      - name: Build doc
        run: npm run build-storybook
      - name: Deploy doc to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: gh-pages
          build_dir: docs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}